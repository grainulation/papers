# pytest settings for the Python test suites of this artifact (the bindings in bindings/python have
# their own settings in pyproject.toml).
#
# tools/evidence/tests, tools/evidence/support/tests and tools/judge/tests are all packages named
# `tests`. pytest's default import mode puts each rootdir on sys.path and imports them under that one
# name, so collecting more than one of them fails. The importlib mode imports each test file by path.
[pytest]
addopts = --import-mode=importlib
testpaths =
    tools/evidence
    tools/judge
    tools/corpus/tests
    real-agent-eval/v4/canon
    real-agent-eval/v5/tests
    real-agent-eval/v6/tests
