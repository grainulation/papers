[package]
name = "overturn"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "overturn: deterministic, replayable arbitration of multi-agent LLM outputs"

[dependencies]
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
regex = "1"
once_cell = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
